<style>
:root{--bg:#07090d;--card:#10151d;--line:#202a38;--text:#e8edf4;--dim:#93a1b6;--amber:#ffb000;--cyan:#3de0ff;--red:#ff5d6c;--green:#4be3a0;--glow:rgba(255,176,0,.07);--glow2:rgba(61,224,255,.06);--gridc:rgba(147,161,182,.05);--ease:cubic-bezier(.2,.8,.2,1);--head:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}

.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}

.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font:500 12px var(--mono);color:var(--text)}

.pick{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.pick button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--dim);font-size:13px}
.pick button[aria-pressed=true]{border-color:var(--amber);color:var(--text);background:color-mix(in srgb,var(--amber) 12%,var(--card))}
.pick.fail button[aria-pressed=true]{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--card))}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}

.player{display:grid;gap:8px}
.ctrls{display:flex;align-items:center;gap:6px}
.cnt{margin-left:auto;font:500 11px var(--mono);color:var(--dim)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}

.bar.run i{animation:fill 3.4s linear}
.tl{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto}
.tl button{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;color:var(--dim);font-size:12.5px}
.tl button[aria-current=true]{color:var(--text);background:color-mix(in srgb,var(--amber) 10%,transparent)}
.tl i{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:600 10px var(--mono);font-style:normal;border:1px solid var(--line)}
.tl button[aria-current=true] i{border-color:var(--amber);color:var(--amber);transform:scale(1.08)}
.tl .done i{background:var(--amber);color:#1a1200;border-color:var(--amber)}
.insp .tag{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.log{display:grid;gap:6px;margin-top:8px}
.log .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;animation:rise .35s var(--ease) both}
.pill{font:600 10px var(--mono);padding:2px 6px;border-radius:5px;border:1px solid var(--line)}
.m-get,.m-post{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 40%,transparent)}
.path{font:12px var(--mono);color:var(--cyan)}
.st2{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.st4{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.none{border:1px dashed var(--line);color:var(--dim);padding:6px 8px;border-radius:8px;font:11px var(--mono)}
svg.dia{width:100%;height:auto;min-height:280px;display:block;aspect-ratio:1020/420}
.band{font:10px var(--mono);fill:var(--dim);letter-spacing:.12em}
.lane{font:11px var(--mono);fill:var(--dim);letter-spacing:.14em}
.nd rect{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.nd text{fill:var(--text);font-family:var(--head);font-size:13px;font-weight:700}
.nd .sub{fill:var(--dim);font-family:var(--mono);font-size:9px;font-weight:500}
.nd.on rect{stroke:var(--amber);fill:color-mix(in srgb,var(--amber) 16%,var(--card))}
.nd.fail rect{stroke:var(--red);fill:color-mix(in srgb,var(--red) 16%,var(--card))}
.nd.on .ring{fill:none;stroke:var(--amber);animation:ring 1.6s var(--ease) infinite}
.nd.fail .ring{stroke:var(--red)}
.ed{fill:none;stroke:var(--line);stroke-width:1.4}
.ed.lit{stroke:var(--amber);stroke-width:2.4;stroke-dasharray:7 6;animation:flow .9s linear infinite}

svg.dim .nd:not(.on){opacity:.55}
svg.dim .ed:not(.lit){opacity:.35}
.nodecard{margin-top:10px}
.device{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0c1016}
.chrome{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#161b22}

.chrome i:nth-child(3){background:#4be3a0}
.url{margin-left:8px;font:11px var(--mono);color:#93a1b6;background:#0c1016;border-radius:999px;padding:3px 10px}
.screen{--ink:#1f2937;--mute:#6b7280;--bg:#f6f8fb;--card:#fff;--line:#e5e7eb;--accent:#1d4ed8;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);font:13px/1.45 var(--body);padding:12px;container-type:inline-size}

.screen p{margin:0;color:#374151;font-size:12.5px}
.s-shape{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.s-shape article,.issue{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.k{font:600 9px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#4338ca}
.s-rail{display:flex;gap:0;overflow-x:auto;margin:10px 0}
.s-rail button{border:0;background:transparent;padding:0;display:flex;align-items:center}
.s-node{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:11px;font-weight:650;color:var(--mute);white-space:nowrap}

.hl{outline:2px solid #b36a00;outline-offset:2px}
.hidden-ctl{display:none}

.trk{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.trk button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer;font:11px var(--mono);color:var(--dim)}
.trk button[aria-current=true]{border-color:var(--amber);color:var(--text)}
details.how{margin-top:22px;color:var(--dim);font-size:13px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes ping{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}

@keyframes ring{from{opacity:.7}to{opacity:0;transform:scale(1.25)}}

@media(max-width:1180px){.stage{grid-template-columns:1fr}.side{position:static;max-height:none}}
@media(max-width:900px){
.rail{inset:auto 0 0 0;width:auto;height:56px;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line)}

.chapters{display:flex;width:100%;--idx:0}
.chapters::before,.chapters::after{display:none}
.chapters li{height:auto;flex:1;justify-content:center}
.main{margin:0 0 64px}
.hero{grid-template-columns:1fr}
.radar{display:none}
.g-cols{grid-template-columns:1fr 1fr}
.s-shape{grid-template-columns:1fr 1fr}
}
@container (max-width:520px){.s-shape{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){
*{animation:none!important;transition:none!important}
.pkt{display:none}
.log .row{animation:none}
}
</style>

    <h3 class="sec">Low-level design</h3>
    <ol class="lld">
      <li>Label starts intake. An actor without write access is ignored.</li>
      <li>Webhook: HMAC, store delivery id, enqueue reconcile, 202. Same delivery id is a no-op.</li>
      <li>State machine: repro → fix → verify → PR → awaiting-qa → done.</li>
      <li>Actions runs the specialists. They return a result and stop. They do not message each other.</li>
      <li>Repro script must fail on the bug and pass on the golden tree.</li>
      <li>locate() returns file:line:col candidates. The production build strips data-src.</li>
      <li>Fix loop in a worktree, Docker with no network, gates before submit.</li>
      <li>Checks short-circuit. Judge writes a note. One pull request, find-or-create.</li>
      <li>A person answers in awaiting-qa. Backport comments on conflict.</li>

function mountStepper(side, dia, rep, steps, fail){
  let i=0, timer=null;
  const base=()=>({rail:"queued",title:"",summary:"",asof:"p8"});
  function at(n){const s=base();for(let k=0;k<=n;k++)steps[k].apply&&steps[k].apply(s);s.summary=steps[n].body;s.title=steps[n].title;return s;}
  function draw(){
    const st=at(i), step=steps[i];
    $(dia).innerHTML=diagram(step.active,{tone:fail?"fail":"",prefix:dia});
    if(rep) $(rep).innerHTML=`<div class="chrome"><i></i><i></i><i></i><span class="url">worked example · ${esc(st.rail)}</span></div><div class="screen">${boardHtml(st)}</div>`;
    $(side).innerHTML=`<div class="card player"><div class="ctrls"><button class="btn" type="button" data-nav="p" ${i?"":"disabled"}>Prev</button><button class="btn pri" type="button" data-nav="play">${timer?"Pause":"Play"}</button><button class="btn" type="button" data-nav="n" ${i<steps.length-1?"":"disabled"}>Next</button><span class="cnt">${i+1} / ${steps.length}</span></div><div class="bar ${timer?"run":""}"><i style="width:${(i/(steps.length-1)||0)*100}%"></i></div></div>
      <ol class="tl">${steps.map((s,k)=>`<li><button type="button" data-go="${k}" ${k===i?"aria-current=step":""} class="${k<i?"done":""}"><i>${k+1}</i>${esc(s.title)}</button></li>`).join("")}</ol>
      <div class="card insp"><div class="tag">${fail?"Fail":"Hop"}</div><h3>${esc(step.title)}</h3><p>${esc(step.body)}</p>${callsHtml(step.calls)}</div>`;
    const cur=$(side).querySelector("[aria-current]"); if(cur) cur.scrollIntoView({block:"nearest"});
  }
  function go(n){i=Math.max(0,Math.min(steps.length-1,n));if(i===steps.length-1){clearInterval(timer);timer=null;}draw();}
  $(side).onclick=e=>{const t=e.target.closest("[data-nav],[data-go]");if(!t)return;if(t.dataset.go!=null){clearInterval(timer);timer=null;go(+t.dataset.go);}else if(t.dataset.nav==="p"){clearInterval(timer);timer=null;go(i-1);}else if(t.dataset.nav==="n"){clearInterval(timer);timer=null;go(i+1);}else{if(timer){clearInterval(timer);timer=null;draw();}else{timer=setInterval(()=>go(i+1),3400);draw();}}};
  draw();
  return {go,get i(){return i;},steps};
}

}
boot();
</script>
