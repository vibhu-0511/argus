<script>
(function () {
  'use strict';
  var A = window.ARGUS;
  var root = document.getElementById('sub-console');
  if (!A || !A.console || !root) return;
  var C = A.console, TK = C.designTokens, DARK = TK.extracted.dark;

  /* ---------- tiny DOM helpers (all data goes through textContent) ---------- */
  function add(e, kids) {
    for (var i = 0; i < kids.length; i++) {
      var c = kids[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) add(e, c);
      else e.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
  }
  function h(tag, p) {
    var e = document.createElement(tag);
    if (p) for (var n in p) {
      var v = p[n];
      if (v == null || v === false) continue;
      if (n === 'class') e.className = v;
      else if (n === 'text') e.textContent = v;
      else if (n.slice(0, 2) === 'on') e.addEventListener(n.slice(2), v);
      else e.setAttribute(n, v === true ? '' : v);
    }
    add(e, Array.prototype.slice.call(arguments, 2));
    return e;
  }
  function dash(v) { return v == null || v === 'ILLUSTRATIVE' ? '—' : String(v); }
  function f3(x) { return Math.max(0, x).toFixed(3); }
  function pc(a, b) { return Math.max(0, Math.min(100, a / b * 100)); }
  function pill(txt, varName, cls) {
    var e = h('span', { class: 'cn-pill ' + (cls || ''), text: txt });
    if (varName) e.style.setProperty('--c', 'var(' + varName + ')');
    return e;
  }
  function statePill(s) { return pill(s, s === 'repro verdict tally' ? '--text-secondary' : '--state-' + s); }
  function verdictPill(v) {
    var s = String(v == null ? 'skipped' : v).replace(/\s*\(ILLUSTRATIVE\)/, '');
    var k = /^advisory/.test(s) ? 'advisory' : /^pass/.test(s) ? 'pass' : /^fail/.test(s) ? 'fail' : /^error/.test(s) ? 'error' : 'skipped';
    return pill(s, '--verdict-' + k);
  }
  function phaseChip(p) {
    if (!p) return '—';
    var e = h('span', { class: 'cn-pill', text: p });
    e.style.setProperty('--c', 'var(--phase-' + String(p).toLowerCase() + ')');
    e.style.color = 'var(--text-primary)';
    return e;
  }
