<style>

.hl-steps button[aria-current="step"] { border-left-color: var(--accent); background: var(--surface-2); color: var(--ink); }
.hl-steps .hl-n { font: 700 0.78rem var(--mono); }
.hl-ctl { display: flex; flex-wrap: wrap; gap: var(--s1); align-items: center; margin: var(--s2) 0; }
.hl-kv { display: grid; grid-template-columns: auto 1fr; gap: 2px var(--s3); margin: var(--s2) 0; font-size: 0.85rem; }

.hl-list { display: none; }

.hl-list details { border: 1px solid var(--line); border-radius: var(--r2); background: var(--surface); margin-bottom: var(--s2); }

.hl-list .hl-li { display: grid; gap: var(--s1); padding: 0 var(--s2) var(--s2); }
.hl-list .hl-li button { text-align: left; min-height: 44px; display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); align-items: center; padding: var(--s2); border: 1px solid var(--line-2); border-radius: var(--r1); background: var(--bg); color: var(--ink); cursor: pointer; font: 0.88rem var(--sans); }

.hl-st.planned path.hl-cyl { fill: var(--surface-2); stroke-dasharray: 4 3; }
.hl-st text { fill: var(--ink); font-size: 10.5px; pointer-events: none; }
.hl-st text.hl-sub { fill: var(--ink-3); font: 9.5px var(--mono); }
.hl-st:focus-visible path.hl-cyl, .hl-st.sel path.hl-cyl { stroke: var(--accent); stroke-width: 3; }
.hl-stlink { stroke: var(--info); stroke-width: 1.3; fill: none; stroke-dasharray: 2 3; }

.hl-mk-f { fill: var(--line-2); } .hl-mk-h { fill: var(--ink-3); } .hl-mk-a { fill: var(--accent); }

<header class="hl-head">
  <h2>High-level design</h2>
  <p id="hl-intro"></p>
</header>

<div class="hl-bar" role="toolbar" aria-label="Diagram controls">
  <div class="hl-grp"><span class="hl-lbl">Layers</span>
    <label class="hl-tog"><input type="checkbox" data-hl-layer="trust"> Trust boundaries</label>
    <label class="hl-tog"><input type="checkbox" data-hl-layer="fd"> Failure domains</label>
    <label class="hl-tog"><input type="checkbox" data-hl-layer="stores"> State stores</label>
  </div>
  <div class="hl-grp"><span class="hl-lbl">View</span>
    <div class="seg" role="group" aria-label="View mode">
      <button type="button" data-hl-view="diagram">Diagram</button>
      <button type="button" data-hl-view="list">List</button>
    </div>
    <span class="hl-grp" id="hl-zoom">
      <button type="button" class="btn ghost" id="hl-fit">Fit width</button>
      <button type="button" class="btn ghost" id="hl-100">Actual size</button>
    </span>
  </div>
</div>
<div class="hl-legend" id="hl-fdlegend" hidden aria-label="Failure domains. Press one to isolate its members."></div>

<div class="hl-main">
  <div>
    <div class="hl-scroll fit" id="hl-scroll" tabindex="-1"></div>
    <div class="hl-list" id="hl-list"></div>
  </div>
  <aside class="hl-aside" aria-label="Flows and details">
    <div class="card"><h3>Data flows (select one)</h3><div class="hl-flows" id="hl-flows"></div></div>
    <div class="card" id="hl-stepcard" hidden></div>
    <div class="card" id="hl-detail" aria-live="polite"></div>
  </aside>
</div>

<div class="hl-ref" id="hl-ref"></div>

<script>
(function () {
  'use strict';
  var A, root, dataOk = false;
  var SVGNS = 'http://www.w3.org/2000/svg';
  var NW = 150, NH = 58, GX = 14, GY = 24, LW = 122, PADY = 16, COLS = 5, LGAP = 10;
  var ZONE_ORDER = ['Z4', 'Z1', 'Z2', 'Z3', 'Z0', 'Z5'];
  var S = { flow: null, step: 0, sel: null, layers: { trust: false, fd: false, stores: false }, fdSel: null, view: 'diagram', fit: true, timer: null };
  var L; // layout

  function h(tag, attrs) {
    var e = document.createElement(tag), i, k, c;
    if (attrs) for (k in attrs) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]); }
    var add = function (c) { if (c == null || c === false) return; if (Array.isArray(c)) return c.forEach(add); e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); };
    for (i = 2; i < arguments.length; i++) add(arguments[i]);
    return e;
  }
  function s(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag), i, k, c;
    if (attrs) for (k in attrs) { if (k === 'text') e.textContent = attrs[k]; else if (attrs[k] != null && attrs[k] !== false) e.setAttribute(k, attrs[k]); }
    for (i = 2; i < arguments.length; i++) { c = arguments[i]; if (c) e.appendChild(c); }
    return e;
  }
  function $(id) { return document.getElementById(id); }
  function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); }

  function copy(text, btn) {
    var done = function () { var o = btn.getAttribute('data-t'); btn.textContent = 'copied'; setTimeout(function () { btn.textContent = o; }, 1100); };
    try { navigator.clipboard.writeText(text).then(done, fb); } catch (e) { fb(); }
    function fb() {
      var t = h('textarea', { 'aria-hidden': 'true' }); t.value = text; t.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) {} document.body.removeChild(t);
    }
  }
  function chipSrc(src) { var b = h('button', { type: 'button', class: 'chip mono', 'data-t': src, title: 'Copy ' + src, text: src }); b.addEventListener('click', function () { copy(src, b); }); return b; }
  function splitSrc(x) { return Array.isArray(x) ? x : String(x || '').split(/,\s*/).filter(Boolean); }
  function srcRow(list) { var w = h('div', { class: 'hl-chips' }); splitSrc(list).forEach(function (x) { w.appendChild(chipSrc(x)); }); return w; }
  function statusChip(st) { return h('span', { class: 'chip ' + (st === 'built' ? 'ok' : 'info'), text: st }); }
  function files(src) { return splitSrc(src).map(function (x) { return x.replace(/:[\d\-,]+$/, ''); }).filter(function (x) { return /^packages\//.test(x); }); }

  /* ---------- model + layout ---------- */
  function build() {
    var comps = {}, order = {}, nOrd = 0, actors = {}, fdIdx = {}, zoneName = {};
    A.components.forEach(function (c) { comps[c.id] = c; });
    A.failureDomains.forEach(function (f, i) { fdIdx[f.id] = i; });
    A.trustZones.forEach(function (z) { zoneName[z.id] = z; });
    function seen(id) { if (!(id in order)) order[id] = nOrd++; }
    A.flows[0].steps.forEach(function (st) { seen(st.from); seen(st.to); });
    A.flows.forEach(function (f) { f.steps.forEach(function (st) { [st.from, st.to].forEach(function (id) { if (!comps[id]) actors[id] = true; }); }); });
    var phaseN = function (p) { return p === 'ext' ? -1 : parseFloat(String(p).replace('P', '')) || 0; };
    var lanes = [];
    var zids = ZONE_ORDER.filter(function (z) { return zoneName[z]; });
    A.trustZones.forEach(function (z) { if (zids.indexOf(z.id) < 0) zids.push(z.id); });
    if (Object.keys(actors).length) lanes.push({ id: 'actor', label: 'Actors', sub: 'outside Argus', nodes: [] });
    zids.forEach(function (z) { lanes.push({ id: z, label: z + ' ' + zoneName[z].label, sub: zoneName[z].holds, rule: zoneName[z].rule, nodes: [] }); });
    var laneBy = {}; lanes.forEach(function (l) { laneBy[l.id] = l; });
    var nodes = {};
    Object.keys(actors).forEach(function (id) {
      var n = { id: id, label: id === 'human' ? 'Human (ticket author, QA)' : id, status: 'external', phase: 'ext', actor: true, zone: 'actor', c: null };
      laneBy.actor.nodes.push(n); nodes[id] = n;
    });
    A.components.forEach(function (c) {
      var n = { id: c.id, label: c.label, status: c.status, phase: c.phase, zone: c.trustZone, fd: c.failureDomain, c: c };
      (laneBy[c.trustZone] || (laneBy[c.trustZone] = lanes[lanes.push({ id: c.trustZone, label: c.trustZone, sub: '', nodes: [] }) - 1])).nodes.push(n); nodes[c.id] = n;
    });
    lanes = lanes.filter(function (l) { return l.nodes.length; });
    var W = LW + GX + COLS * (NW + GX), y = 8;
    lanes.forEach(function (l, li) {
      l.nodes.sort(function (a, b) {
        var ra = a.id in order ? order[a.id] : 1000 + phaseN(a.phase), rb = b.id in order ? order[b.id] : 1000 + phaseN(b.phase);
        return ra - rb;
      });
      var rows = Math.ceil(l.nodes.length / COLS);
      l.y = y; l.h = PADY * 2 + rows * NH + (rows - 1) * GY + (l.id === 'actor' ? 0 : 0); l.alt = li % 2;
      l.nodes.forEach(function (n, i) { n.x = LW + GX + (i % COLS) * (NW + GX); n.y = y + PADY + Math.floor(i / COLS) * (NH + GY); n.lane = l; });
      y += l.h + LGAP;
    });
    // stores band
    var band = { y: y + 10 }, sw = 150, sh = 46, sg = 14;
    A.stores.forEach(function (st, i) { st.x = LW + GX + (i % COLS) * (NW + GX); st.y = band.y + 28 + Math.floor(i / COLS) * (sh + 16); st.w = sw; st.h = sh; });
    band.h = 28 + Math.ceil(A.stores.length / COLS) * (sh + 16) + 8;
    // store <-> component links: shared packages/ source file, or store.where naming the component label
    var sl = {}, cl = {};
    A.stores.forEach(function (st) {
      var sf = files(st.source), where = (st.where || '').toLowerCase();
      A.components.forEach(function (c) {
        var hit = c.sources.some(function (x) { return files(x).some(function (f) { return sf.indexOf(f) >= 0; }); }) ||
          (c.status === 'planned' && where && where.indexOf(c.label.toLowerCase()) >= 0);
        if (hit) { (sl[st.id] = sl[st.id] || []).push(c.id); (cl[c.id] = cl[c.id] || []).push(st.id); }
      });
    });
    // idempotency per component (flow-step keys + operations sharing a source file)
    var idem = {};
    A.flows.forEach(function (f) { f.steps.forEach(function (st) {
      if (!st.idempotencyKey || /^n\/a/.test(st.idempotencyKey)) return;
      [st.to, st.from].forEach(function (id) { (idem[id] = idem[id] || []).push({ k: st.idempotencyKey, where: f.id + ' step ' + st.n, src: st.source }); });
    }); });
    A.idempotency.forEach(function (o) {
      var of = files(o.source);
      A.components.forEach(function (c) {
        if (c.sources.some(function (x) { return files(x).some(function (f) { return of.indexOf(f) >= 0; }); })) (idem[c.id] = idem[c.id] || []).push({ k: o.key, where: o.operation, src: o.source });
      });
    });
    var w = (A.stores.length ? band.y + band.h : y) + 6;
    L = { comps: comps, nodes: nodes, lanes: lanes, W: W, H: w, band: band, fdIdx: fdIdx, zone: zoneName, sl: sl, cl: cl, idem: idem, laneBy: laneBy };
  }

  /* ---------- geometry ---------- */
  function geom(a, b, off) {
    var d, mx, my, p1, p2, dy;
    if (a === b) {
      p1 = { x: a.x + NW - 34, y: a.y }; p2 = { x: a.x + NW - 8, y: a.y };
      return { d: 'M' + p1.x + ',' + p1.y + ' C' + (p1.x - 6) + ',' + (p1.y - 30) + ' ' + (p2.x + 6) + ',' + (p2.y - 30) + ' ' + p2.x + ',' + p2.y, mx: (p1.x + p2.x) / 2, my: p1.y - 23 };
    }
    if (b.y > a.y + 1) { p1 = { x: a.x + NW / 2 + off, y: a.y + NH }; p2 = { x: b.x + NW / 2 + off, y: b.y }; dy = (p2.y - p1.y) / 2; d = 'M' + p1.x + ',' + p1.y + ' C' + p1.x + ',' + (p1.y + dy) + ' ' + p2.x + ',' + (p2.y - dy) + ' ' + p2.x + ',' + p2.y; }
    else if (b.y < a.y - 1) { p1 = { x: a.x + NW / 2 + off, y: a.y }; p2 = { x: b.x + NW / 2 + off, y: b.y + NH }; dy = (p1.y - p2.y) / 2; d = 'M' + p1.x + ',' + p1.y + ' C' + p1.x + ',' + (p1.y - dy) + ' ' + p2.x + ',' + (p2.y + dy) + ' ' + p2.x + ',' + p2.y; }
    else if (Math.abs(b.x - a.x) <= NW + GX + 1) {
      var r = b.x > a.x; p1 = { x: a.x + (r ? NW : 0), y: a.y + NH / 2 + off }; p2 = { x: b.x + (r ? 0 : NW), y: b.y + NH / 2 + off }; d = 'M' + p1.x + ',' + p1.y + ' L' + p2.x + ',' + p2.y;
    } else { p1 = { x: a.x + NW / 2 + off, y: a.y }; p2 = { x: b.x + NW / 2 + off, y: b.y }; d = 'M' + p1.x + ',' + p1.y + ' C' + p1.x + ',' + (p1.y - 40) + ' ' + p2.x + ',' + (p2.y - 40) + ' ' + p2.x + ',' + p2.y; }
    mx = (p1.x + p2.x) / 2; my = (p1.y + p2.y) / 2;
    if (d.indexOf('C') > 0 && Math.abs(p1.y - p2.y) < 2) my = p1.y - 30;
    return { d: d, mx: mx, my: my };
  }

  /* ---------- render svg ---------- */
  function relevant(id) {
    var n = L.nodes[id];
    if (S.fdSel && !(n && n.fd === S.fdSel)) return false;
    return true;
  }
  function onPath(id) {
    if (S.flow == null) return false;
    return A.flows[S.flow].steps.some(function (st) { return st.from === id || st.to === id; });
  }
