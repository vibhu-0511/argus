[project]
name = "argus"
version = "0.0.0"
description = "Argus monorepo. The root is the workspace, not an installable package."
requires-python = ">=3.12"
dependencies = ["argus-core", "argus-bench"]

[tool.uv]
package = false

[tool.uv.sources]
argus-core = { workspace = true }
argus-bench = { workspace = true }

[tool.uv.workspace]
members = ["packages/argus-core", "packages/bench", "packages/repro-agent", "packages/dom2src-mcp", "packages/fix-loop", "packages/verify"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = [
    "docker: needs a Docker daemon and builds or runs the sandbox image",
    "live_app: needs the Playwright MCP server via npx",
    "live: needs a dcortex-platform checkout (ARGUS_PLATFORM_REPO) and, for the embed test, the pgvector container on port 5436",
]
