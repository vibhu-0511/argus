[project]
name = "argus-workbench"
version = "0.1.0"
description = "P10 argus-workbench: local web UI (five screens) over scripted and replayed runs. No model calls."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argus-core",
    "flow",
    "argus-app",
    "fix-loop",
    "verify",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]

[project.scripts]
argus-workbench = "argus_workbench.cli:main"

[tool.uv.sources]
argus-core = { workspace = true }
flow = { workspace = true }
argus-app = { workspace = true }
fix-loop = { workspace = true }
verify = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
