[project]
name = "flow"
version = "0.1.0"
description = "Durable ticket-to-fix workflow, webhook endpoint and reconciliation poller."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["argus-core", "pydantic>=2.14.1", "fastapi>=0.115", "httpx>=0.27"]

[tool.uv.sources]
argus-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
