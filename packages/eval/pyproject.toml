[project]
name = "eval"
version = "0.1.0"
description = "Trajectory metrics and the eval runner with Wilson intervals."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["argus-core", "pydantic>=2.14.1"]

[project.scripts]
eval = "eval.__main__:main"

[tool.uv.sources]
argus-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
