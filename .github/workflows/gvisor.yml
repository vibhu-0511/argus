name: gvisor

# P7-T10. Manual dispatch, and it also runs on a pull request that changes this file (2026-11-03: added so the first real run can happen before this file reaches main, where manual dispatch becomes possible). No model call, no secrets, no tokens.
# Installs gVisor (runsc) on a hosted Linux runner, registers it as a Docker runtime, runs the fixture task and the escape
# suite on the gvisor tier, and stores both result files as the artifact `gvisor`. Download it and commit the files into
# packages/guard/results/ (owner steps: docs/notes/p7-t10.md). The job fails if the runtime did not register or a step fails.
# Unproven: the tarball layout (found by name below), `runsc install` on a hosted runner, and the sandbox on the runner's kernel.
on:
  pull_request:
    paths: ['.github/workflows/gvisor.yml']
  workflow_dispatch:
    inputs:
      release:
        description: "gVisor release tag (pinned in docs/notes/p7-t00-versions.md)"
        default: "release-20261026.0"

permissions:
  contents: read

jobs:
  gvisor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - name: Install runsc from the release tarball and check its checksum
        env:
          REL: ${{ inputs.release || 'release-20261026.0' }}
        run: |
          ARCH="$(uname -m)"
          base="https://github.com/google/gvisor/releases/download/$REL"
          curl -fsSLO "$base/gvisor-$ARCH.tar.bz2"
          curl -fsSLO "$base/SHA256SUMS"
          sha256sum -c --ignore-missing SHA256SUMS
          mkdir gvisor && tar -xjf "gvisor-$ARCH.tar.bz2" -C gvisor
          sudo install -m 0755 "$(find gvisor -name runsc -type f | head -n 1)" /usr/local/bin/runsc
          runsc --version
      - name: Register runsc with Docker
        run: |
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          cat /etc/docker/daemon.json
          docker info --format '{{json .Runtimes}}'
          uname -r
          ls -l /dev/kvm || echo "no /dev/kvm (information only, gVisor does not need it by default)"
      - name: Run the fixture task under runsc
        run: uv run --all-packages python -m guard.sandbox_run --runtime runsc --out packages/guard/results/sandbox-run-runsc.json
      - name: Run the escape suite on the gvisor tier
        run: uv run --all-packages python -m guard.escape --tier gvisor --out packages/guard/results/escape-gvisor.json
      - name: Escape suite on gVisor, 5 repeats (the fork-bomb probe ended as an error in 2 of 3 ablation runs)
        if: always()
        run: |
          for i in 1 2 3 4 5; do
            echo "=== repeat $i"
            uv run --all-packages python -m guard.escape --tier gvisor --out packages/guard/results/escape-gvisor-repeat-$i.json | grep -E 'fork-bomb|probes:' || true
          done
      - name: Ablation row A on this runner (Docker, 30 starts)
        run: |
          rc=0
          uv run --all-packages python -m guard.ablation --tier docker --n 30 --out packages/guard/results/ablation-docker-actions.json || rc=$?
          cat packages/guard/results/ablation-docker-actions.json
          exit $rc
      - name: Ablation row B on this runner (gVisor, 30 starts)
        if: always()
        run: |
          rc=0
          uv run --all-packages python -m guard.ablation --tier gvisor --n 30 --out packages/guard/results/ablation-gvisor-actions.json || rc=$?
          cat packages/guard/results/ablation-gvisor-actions.json
          exit $rc
      - name: Escape suite on gVisor right after the ablation (the fork-bomb probe errored in the suite that ran inside it, 3 of 3)
        if: always()
        run: |
          echo "runsc processes alive: $(pgrep -c -f runsc || true)"; docker ps -a --format '{{.Names}} {{.Status}}' | head
          for i in 1 2 3; do uv run --all-packages python -m guard.escape --tier gvisor --out packages/guard/results/escape-gvisor-after-$i.json | grep -E 'fork-bomb|probes:' || true; done
      - name: Show the results
        if: always()
        run: |
          for f in sandbox-run-runsc escape-gvisor ablation-docker-actions ablation-gvisor-actions; do
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "packages/guard/results/$f.json" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gvisor
          path: |
            packages/guard/results/sandbox-run-runsc.json
            packages/guard/results/escape-gvisor.json
            packages/guard/results/ablation-docker-actions.json
            packages/guard/results/ablation-gvisor-actions.json
