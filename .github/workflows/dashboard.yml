name: dashboard

# Builds packages/dashboard from the results files in the repo and attaches the page to the run as a download.
# No Pages: GitHub Pages is not available on this private repo's plan (docs/notes/p5-t22.md).
# No model call, no network beyond GitHub, no tokens or keys.
on:
  workflow_dispatch:
  push:
    paths:
      - "packages/dashboard/**"
      - "packages/eval/results/**"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only the two files the page needs; the page opens from disk (links are relative, data is a script file).
      - name: Build the page
        run: |
          python3 packages/dashboard/build.py --out _site
          cp packages/dashboard/index.html _site/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard
          path: _site
          retention-days: 30
