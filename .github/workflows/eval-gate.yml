name: eval-gate

# Stored results only: no model call, no network, no keys or tokens. The gate compares
# packages/eval/results/current.json with packages/eval/results/baseline.json (thresholds: packages/eval/gate.toml).
on:
  push:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv run pytest packages/eval/tests -q
      - run: uv run --package eval python -m eval gate packages/eval/results/current.json --baseline packages/eval/results/baseline.json
