name: repro

on:
  push:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --all-packages --locked
      - run: pnpm install --frozen-lockfile
      # bench score tests drive Chromium through @playwright/test
      - run: pnpm --filter @argus/bench exec playwright install --with-deps chromium
      # docker and live_app tests need a daemon or the Playwright MCP server; run them locally
      - run: uv run pytest packages/argus-core/tests packages/bench/tests packages/repro-agent/tests -m "not docker and not live_app" -q

  bugsmith:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @argus/bugsmith test
