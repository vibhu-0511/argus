name: verify

on:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv run pytest packages/verify/tests -q
      - run: uv run --package verify python -m verify ci packages/verify/fixtures/ci/match
      - run: node --experimental-strip-types --test packages/verify/test/capture.test.ts
