name: fix-loop

on:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv run pytest packages/fix-loop/tests -q -k "not sandbox and not ast_grep"
      - run: uv run --package fix-loop python -m fix_loop.frameworks
