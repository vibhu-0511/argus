name: secret-scan

# P7-T03. Fails when a tracked file holds a token, a git remote URL carries one, or a workflow names a model secret.
# No model, no credentials and no network beyond the checkout; the script is standard-library Python.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan the repository for tokens and credentialed remote URLs
        run: python3 .github/workflows/check_no_secrets.py
